[project]
name = "crael4i-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.2",
    "openpyxl>=3.1.5",
    "pyside6>=6.11.1",
    "pyside6-fluent-widgets>=1.11.2",
]

[project.scripts]
douhot-crawl = "douhot_crawler.__main__:main"
douhot-analyze = "douhot_crawler.analyzer:main"
douhot-gui = "douhot_crawler.gui:main"
douhot-login = "douhot_crawler.login_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["douhot_crawler"]

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
