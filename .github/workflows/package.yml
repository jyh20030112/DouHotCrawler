name: Package desktop application

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v

  package:
    name: ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
          - target: Linux-x86_64
            runner: ubuntu-24.04
          # GitHub currently labels this hosted image as public preview. 
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install build dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "windows-arm64" ]]; then
            # Shapely 2.1.2 ships no Windows ARM64 wheel. Crawl4AI declares it
            # for optional geometry features that this application does not use.
            uv sync --frozen --group build --no-install-package shapely
          else
            uv sync --frozen --group build
          fi
      - name: Build native bundle
        shell: bash
        run: bash scripts/build_package.sh
      - name: Smoke-test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f dist/DouHotCrawler/DouHotCrawler.exe
          else
            test -f dist/DouHotCrawler/DouHotCrawler
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DouHotCrawler-${{ matrix.target }}
          path: dist/DouHotCrawler
          if-no-files-found: error
