name: Package desktop application

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q

  package:
    name: ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
          - target: Linux-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - name: Install build dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "windows-arm64" ]]; then
            # Shapely 2.1.2 ships no Windows ARM64 wheel. Crawl4AI declares it
            # for optional geometry features that this application does not use.
            uv sync --frozen --group build --no-install-package shapely
          else
            uv sync --frozen --group build
          fi
      - name: Build native bundle
        shell: bash
        run: bash scripts/build_package.sh
      - name: Smoke-test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f dist/DouHotCrawler/DouHotCrawler.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            test -d dist/DouHotCrawler.app
          else
            test -f dist/DouHotCrawler/DouHotCrawler
          fi
      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DouHotCrawler -DestinationPath "DouHotCrawler-${{ matrix.target }}.zip"
      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          (cd dist && zip -ry ../"DouHotCrawler-${{ matrix.target }}.zip" DouHotCrawler.app)
      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (cd dist && zip -r ../"DouHotCrawler-${{ matrix.target }}.zip" DouHotCrawler)
      - uses: actions/upload-artifact@v4
        with:
          name: DouHotCrawler-${{ matrix.target }}
          path: DouHotCrawler-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DouHotCrawler-*
          path: artifacts
          merge-multiple: false
      - name: Collect zip files
        shell: bash
        run: |
          find artifacts -name '*.zip' -exec mv {} . \;
      - uses: softprops/action-gh-release@v2
        with:
          files: "DouHotCrawler-*.zip"
          generate_release_notes: true
